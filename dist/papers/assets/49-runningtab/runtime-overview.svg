<?xml version="1.0" encoding="UTF-8"?>
<svg class="rt-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="rt-runtime-title rt-runtime-desc">
<title id="rt-runtime-title">运行中：原生执行循环与环境自动捕获</title><desc id="rt-runtime-desc">同一个LLM调用文件工具并接收观察。LLM通过add登记要求R。环境旁路捕获工具展示的正文为读取日志L，仅列出的路径为未读候选C，读取后移出C。</desc>
<defs><marker id="rt-runtime-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4e729f"/></marker><marker id="rt-runtime-capture" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#348174"/></marker></defs>
<style>
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334e70;font-size:20px}
.map-title{font-size:24px;font-weight:600;fill:#263f61}.map-body{font-size:20px}.map-small{font-size:18px;fill:#60768f}.map-label{font-size:19px;fill:#45678d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}
.map-agent{fill:#fff7e9;stroke:#d9b985;stroke-width:1.8}.map-tool{fill:#fff;stroke:#b5c8e0;stroke-width:1.8}.map-store{fill:#fff;stroke:#aac9c3;stroke-width:1.8}.map-program{fill:#f0f5fc;stroke:#a8bfdc;stroke-width:1.8}.map-finish{fill:#f5f1fa;stroke:#bfb2d6;stroke-width:1.8}.map-scope{fill:#f1f8f6;stroke:#8cb8ad;stroke-width:1.6;stroke-dasharray:8 6}
.map-route{fill:none;stroke:#4e729f;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#rt-runtime-arrow)}
.map-capture{fill:none;stroke:#348174;stroke-width:2.4;stroke-dasharray:8 6;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#rt-runtime-capture)}
</style><rect x="90" y="55" width="355" height="150" rx="12" class="map-agent"/><text x="112" y="93" class="map-title">执行 agent · LLM</text><text x="112" y="131" class="map-body">理解任务、决定下一步</text><text x="112" y="162" class="map-body">搜索／读取／写作</text><rect x="740" y="55" width="355" height="150" rx="12" class="map-tool"/><text x="762" y="93" class="map-title">原有文件工具</text><text x="762" y="131" class="map-body">列目录、搜索、读文件</text><text x="762" y="162" class="map-body">写入最终报告或表格</text><path class="map-route" d="M445 100 H740"/><text x="590" y="86" class="map-label" text-anchor="middle">工具调用</text><path class="map-route" d="M740 173 H445"/><text x="590" y="159" class="map-label" text-anchor="middle">工具观察＋账本状态</text><rect x="40" y="315" width="1120" height="225" rx="15" class="map-scope"/><text x="390" y="351" class="map-title">环境侧账本 · 跨轮保存</text><rect x="75" y="397" width="290" height="117" rx="12" class="map-store"/><text x="97" y="435" class="map-title">R · 任务要求</text><text x="97" y="473" class="map-body">模型登记，程序保存</text><text x="97" y="504" class="map-body">跟踪 open / 结清状态</text><rect x="420" y="397" width="360" height="117" rx="12" class="map-store"/><text x="442" y="435" class="map-title">L · 读取日志</text><text x="442" y="473" class="map-body">展示原文＋路径／命令</text><text x="442" y="504" class="map-body">分配编号，供后续回查</text><rect x="835" y="397" width="290" height="117" rx="12" class="map-store"/><text x="857" y="435" class="map-title">C · 未读候选</text><text x="857" y="473" class="map-body">只出现路径的文件</text><text x="857" y="504" class="map-body">读到内容后移除</text><path class="map-route" d="M220 205 V397"/><text x="236" y="278" class="map-label">add：登记要求</text><path class="map-capture" d="M925 205 V372 H600 V397"/><path class="map-capture" d="M925 372 H980 V397"/><text x="945" y="264" class="map-label">自动捕获</text><text x="620" y="388" class="map-small">正文</text><text x="1000" y="388" class="map-small">仅路径</text></svg>