<?xml version="1.0" encoding="UTF-8"?>
<svg class="rt-map" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="rt-settlement-title rt-settlement-desc">
<title id="rt-settlement-title">复核与收尾：账本如何帮助同一个LLM补全交付</title><desc id="rt-settlement-desc">LLM用list或show请求复核；程序BM25匹配要求与日志候选后返回线索。LLM核对、提取、补写，再以resolve提交结清。程序检查失败时保持open并返回原因，成功时更新R。首次stop触发最多一次finish check，再返回同一个LLM补做。</desc>
<defs><marker id="rt-settlement-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#4e729f"/></marker><marker id="rt-settlement-capture" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 Z" fill="#348174"/></marker></defs>
<style>
text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif;fill:#334e70;font-size:20px}
.map-title{font-size:24px;font-weight:600;fill:#263f61}.map-body{font-size:20px}.map-small{font-size:18px;fill:#60768f}.map-label{font-size:19px;fill:#45678d;paint-order:stroke;stroke:#fff;stroke-width:7;stroke-linejoin:round}
.map-agent{fill:#fff7e9;stroke:#d9b985;stroke-width:1.8}.map-tool{fill:#fff;stroke:#b5c8e0;stroke-width:1.8}.map-store{fill:#fff;stroke:#aac9c3;stroke-width:1.8}.map-program{fill:#f0f5fc;stroke:#a8bfdc;stroke-width:1.8}.map-finish{fill:#f5f1fa;stroke:#bfb2d6;stroke-width:1.8}.map-scope{fill:#f1f8f6;stroke:#8cb8ad;stroke-width:1.6;stroke-dasharray:8 6}
.map-route{fill:none;stroke:#4e729f;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#rt-settlement-arrow)}
.map-capture{fill:none;stroke:#348174;stroke-width:2.4;stroke-dasharray:8 6;stroke-linejoin:round;stroke-linecap:round;marker-end:url(#rt-settlement-capture)}
</style><path class="map-route" d="M550 150 V90 H190 V150"/><text x="355" y="76" class="map-label" text-anchor="middle">LLM 按需调用 list / show</text><path class="map-route" d="M1010 150 V35 H650 V150"/><text x="838" y="22" class="map-label" text-anchor="middle">拒绝：保持 open，返回原因</text><rect x="40" y="150" width="300" height="155" rx="12" class="map-program"/><text x="62" y="188" class="map-title">Review · 程序检索</text><text x="62" y="226" class="map-body">按要求用 BM25 匹配 L / C</text><text x="62" y="257" class="map-body">返回编号、原文行与路径</text><text x="62" y="288" class="map-body">show 按编号取回原文</text><rect x="450" y="150" width="300" height="155" rx="12" class="map-agent"/><text x="472" y="188" class="map-title">同一个执行 LLM</text><text x="472" y="226" class="map-body">核对原文、提取／计算</text><text x="472" y="257" class="map-body">补读文件、补写交付物</text><rect x="860" y="150" width="300" height="155" rx="12" class="map-program"/><text x="882" y="188" class="map-title">Resolve · 程序检查</text><text x="882" y="226" class="map-body">done：日志引用＋词汇关联</text><text x="882" y="257" class="map-body">unavailable：必须说明理由</text><text x="882" y="288" class="map-body">只验引用，不验交付语义</text><path class="map-route" d="M340 225 H450"/><text x="395" y="211" class="map-label" text-anchor="middle">线索／原文</text><path class="map-route" d="M750 225 H860"/><text x="805" y="211" class="map-label" text-anchor="middle">提交结清</text><path class="map-route" d="M1010 305 V415"/><text x="1027" y="368" class="map-label">通过</text><rect x="860" y="415" width="300" height="110" rx="12" class="map-store"/><text x="882" y="453" class="map-title">更新 R 的结清状态</text><text x="882" y="491" class="map-body">done / unavailable</text><path class="map-route" d="M650 305 V445"/><text x="665" y="388" class="map-label">首次 stop</text><rect x="430" y="445" width="360" height="135" rx="12" class="map-finish"/><text x="452" y="483" class="map-title">Finish Check · 最多一次</text><text x="452" y="521" class="map-body">返回未结清要求与未读线索</text><text x="452" y="552" class="map-body">已结清时也提醒核对交付物</text><path class="map-route" d="M430 510 H370 V355 H520 V305"/><text x="385" y="390" class="map-label">提醒一次</text><text x="76" y="632" class="map-small">账本返回的是证据与状态；实际提取、修改和是否继续，由同一个 LLM 决定。</text></svg>